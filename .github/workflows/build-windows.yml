name: build-windows

# 手动触发，或推送 v1.0.0 这种 tag 时自动出包
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # 打 tag 时 softprops/action-gh-release 需要写 Release，缺了会报 not accessible by integration

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 NSIS 安装包
        run: npm run build:win
        env:
          # 不打签名：GitHub 上没有证书，用户首次运行会看到 SmartScreen 提示
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 30

      - name: 附带发布到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
